apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 058264118655.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-1-frontend:latest

          ports:
            - containerPort: 3000
